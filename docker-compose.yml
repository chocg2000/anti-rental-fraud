services:
  backend:
    build: .
    # 2026-09-16 보안 점검: 호스트에 직접 포트를 열면(ports) nginx를 거치지 않고 누구나
    # 백엔드를 바로 두드릴 수 있다 — 그러면 Dockerfile의 --forwarded-allow-ips='*'가
    # 신뢰하는 X-Forwarded-For를 공격자가 마음대로 조작해 rate_limiter.py의 IP 기반
    # 제한을 무력화할 수 있다. expose는 호스트에 포트를 열지 않고 컴포즈 내부 네트워크
    # 에서만 접근을 허용한다 — frontend(nginx)는 어차피 호스트 포트가 아니라 컴포즈
    # 내부 DNS(http://backend:8000)로 접속하므로 서비스 동작에는 영향이 없다. 로컬에서
    # http://localhost:8000/docs로 직접 접근하던 편의는 이제 없다 — 필요하면
    # `docker compose exec backend curl ...`이나 `docker compose port backend 8000`으로
    # 확인할 것.
    expose:
      - "8000"
    environment:
      # docker-compose가 이 파일과 같은 폴더의 .env를 읽어 ${...} 치환에 쓴다(컨테이너에
      # .env 전체를 주입하는 게 아님 — 그래서 TESSERACT_CMD 같은 Windows 로컬 전용 경로가
      # 컨테이너 안으로 새어 들어가지 않는다. 컨테이너 안은 apt-get 설치본이 PATH에 있어서
      # 애초에 그 값들이 필요 없다).
      # ⚠️ VWORLD_API_KEY/VWORLD_DOMAIN이 빠져있던 버그가 있었다 — public_price_adapter.py는
      # 이 값이 없으면 조용히 "error"만 반환하므로(크래시 안 함), VWorld를 로컬에서 실제로
      # 검증해놓고도 Docker 배포에서는 이 값이 안 넘어가서 항상 꺼져있는 상태였다.
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY}
      - MOLIT_SERVICE_KEY=${MOLIT_SERVICE_KEY}
      - VWORLD_API_KEY=${VWORLD_API_KEY}
      - VWORLD_DOMAIN=${VWORLD_DOMAIN}
      # assessment_store.py의 기본값(상대경로 "data/assessments.db")은 WORKDIR가 /app이라
      # 결과적으로 /app/data/assessments.db가 되어 아래 볼륨과 지금은 맞아떨어지지만, 그건
      # Dockerfile의 WORKDIR와 우연히 일치하는 것일 뿐이다 — 나중에 WORKDIR를 바꾸거나
      # CMD를 다른 방식(gunicorn 등)으로 바꾸면 조용히 볼륨 밖에 DB가 생겨 재배포마다
      # 데이터가 날아가는 버그가 재발할 수 있다. 명시적으로 고정해서 그 암묵적 의존을 없앤다.
      - ASSESSMENT_DB_PATH=/app/data/assessments.db
    volumes:
      # assessment_store.py(SQLite)의 결과 DB — 이 볼륨이 없으면 컨테이너를 재생성할 때마다
      # (재배포, docker compose down/up 등) 진단 결과와 공유 링크가 전부 사라진다. 컨테이너
      # 내부 경로는 반드시 위 ASSESSMENT_DB_PATH와 같은 디렉토리(/app/data)여야 한다.
      - ./data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
