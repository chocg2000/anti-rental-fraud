server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 배포 환경에서 TLS 종료가 Cloudflare 또는 Nginx에서 이루어지면 HTTPS를 적용한다.
    # 운영 서버에서는 다음 패턴을 적용하는 것을 권장한다.
    # 1) Cloudflare Full (strict) 모드: nginx는 80/443 양쪽을 모두 열어도 되고, TLS는 Cloudflare에서 종료한다.
    # 2) 직접 TLS: 아래와 같은 443 ssl 서버 블록을 활성화하고 Certbot 인증서를 마운트한다.
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name example.com;
    #     ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    #     return 301 https://$host$request_uri;
    # }

    # 백엔드(api.py)의 MAX_REGISTRY_UPLOAD_BYTES(15MB)와 반드시 맞춰야 한다 — nginx
    # 기본값(1MB)인 채로 두면 정상 크기의 등기부등본 PDF조차 nginx 단계에서 413으로
    # 막혀버린다.
    client_max_body_size 16m;

    # vite.config.js의 dev 프록시(/api -> 127.0.0.1:8000)와 동일한 역할.
    # "backend"는 docker-compose.yml의 서비스 이름 — 컴포즈 내부 DNS로 자동 연결됨.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # react-router-dom의 클라이언트 사이드 라우팅(/step1, /step2, /result/:id) 대응 —
    # 없는 경로는 전부 index.html로 넘겨서 React Router가 처리하게 한다.
    location / {
        try_files $uri /index.html;
    }
}
