server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 백엔드(api.py)의 MAX_REGISTRY_UPLOAD_BYTES(15MB)와 반드시 맞춰야 한다 — nginx
    # 기본값(1MB)인 채로 두면 정상 크기의 등기부등본 PDF조차 nginx 단계에서 413으로
    # 막혀버린다(2026-09-16 보안 점검 중 발견한 실제 버그, 백엔드까지 요청이 가보지도
    # 못하고 막혀서 그동안 이 배포 경로로는 업로드 기능 자체가 동작하지 않았을 것).
    client_max_body_size 16m;

    # vite.config.js의 dev 프록시(/api -> 127.0.0.1:8000)와 동일한 역할.
    # "backend"는 docker-compose.yml의 서비스 이름 — 컴포즈 내부 DNS로 자동 연결됨.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # api.py의 IP 기반 rate limiting(rate_limiter.py)이 request.client.host를 쓰는데,
        # 이 헤더가 없으면 모든 유저가 nginx 컨테이너의 IP 하나로 뭉뚱그려져 rate limit이
        # "사이트 전체에 분당 N회"가 돼버린다 — 반드시 실제 클라이언트 IP를 넘겨야 한다.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # react-router-dom의 클라이언트 사이드 라우팅(/step1, /step2, /result/:id) 대응 —
    # 없는 경로는 전부 index.html로 넘겨서 React Router가 처리하게 한다.
    location / {
        try_files $uri /index.html;
    }
}
